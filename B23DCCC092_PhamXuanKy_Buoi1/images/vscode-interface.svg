  <text x="80" y="128" font-family="'Segoe UI', sans-serif" font-size="12" fill="#264de4">#  style.css</text>
  <text x="80" y="151" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f7df1e">JS script.js</text>
  <text x="80" y="174" font-family="'Segoe UI', sans-serif" font-size="12" fill="#007acc">▼ images</text>
  <text x="95" y="197" font-family="'Segoe UI', sans-serif" font-size="12" fill="#9cdcfe">logo.svg</text>
