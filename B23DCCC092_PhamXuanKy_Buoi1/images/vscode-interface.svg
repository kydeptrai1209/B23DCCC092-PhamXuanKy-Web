    <text x="285" y="222" fill="#808080">&lt;</text><text x="293" y="222" fill="#569cd6">h1</text><text x="310" y="222" fill="#808080">&gt;</text><text x="318" y="222" fill="#d4d4d4">Visual Studio Code (VS Code)</text><text x="560" y="222" fill="#808080">&lt;/</text><text x="576" y="222" fill="#569cd6">h1</text><text x="593" y="222" fill="#808080">&gt;</text>

    <!-- Line 8 -->
    <text x="242" y="244" fill="#858585">8</text>
    <text x="285" y="244" fill="#808080">&lt;</text><text x="293" y="244" fill="#569cd6">p</text><text x="302" y="244" fill="#808080">&gt;</text><text x="310" y="244" fill="#d4d4d4">Trình biên tập mã nguồn phổ biến hàng đầu thế giới.</text><text x="730" y="244" fill="#808080">&lt;/</text><text x="746" y="244" fill="#569cd6">p</text><text x="755" y="244" fill="#808080">&gt;</text>
