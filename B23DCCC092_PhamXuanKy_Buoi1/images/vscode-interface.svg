    <!-- Extensions Icon -->
    <rect x="3" y="140" width="7" height="7" fill="#858585"/>
    <rect x="11" y="140" width="7" height="7" fill="#858585"/>
    <rect x="3" y="148" width="7" height="7" fill="#858585"/>
