  <circle cx="56" cy="16" r="6" fill="#61c554" />
  <text x="400" y="21" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cccccc" text-anchor="middle">index.html - Visual Studio Code</text>

  <!-- Left Activity Bar (Darkest strip) -->
  <rect x="0" y="32" width="48" height="426" fill="#333333" />
